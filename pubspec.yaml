name: fire
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  cloud_firestore: ^6.1.0
  cloudinary_flutter: ^1.0.0
  cloudinary_url_gen: ^1.0.0
  easy_locale: ^0.0.12
  easy_localization: ^3.0.8
  firebase_auth: ^6.1.2
  firebase_core: ^4.2.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.1
  gap: ^3.0.1
  go_router: ^16.3.0
  google_nav_bar: ^5.0.7
  http: ^1.5.0
  image_picker: ^1.2.1
  lottie: 3.3.1
  shared_preferences: ^2.1.0
  show_custom_snackbar: ^0.0.1
  smooth_page_indicator: ^1.2.1
  snackbar: ^1.0.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/font/Cairo-Regular.ttf
          weight: 400
        - asset: assets/font/Cairo-Bold.ttf
          weight: 700
        - asset: assets/font/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/font/Cairo-Medium.ttf
          weight: 500
